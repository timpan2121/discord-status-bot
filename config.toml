# Statusbot-konfiguration
# Webhook: Discord-kanal -> Redigera kanal -> Integrationer -> Webhooks -> Ny webhook -> Kopiera URL.
# Lägg den helst i miljövariabeln DISCORD_WEBHOOK_URL istället för här.

interval = 120                 # standardintervall (sek) per källa
announce_open_on_start = true  # posta pågående incidenter vid första start

[language]
# Översättning av incidenttexter till svenska:
#  "auto" = DeepL om DEEPL_API_KEY finns i .env (bäst, gratis 500k tecken/mån), annars MyMemory (gratis, ingen nyckel)
#  "off"  = behåll originalspråket (statusord översätts ändå)
translate = "auto"

[discord]
webhook_url = ""
mention = ""                   # t.ex. "<@&ROLL_ID>" för att pinga en roll

# ---------------- Microsoft ----------------
[source.m365]
category = "Microsoft"
page = "https://status.cloud.microsoft/"
name = "Microsoft 365"
type = "m365public"            # publika status.cloud.microsoft, ingen inloggning
service = "m365Consumer"
interval = 60

[source.azure]
category = "Microsoft"
page = "https://azure.status.microsoft/en-us/status/"
name = "Azure"
type = "rss"
url = "https://azure.status.microsoft/en-us/status/feed/"

# Detaljerad M365 Service Health för er tenant (Exchange, Teams, SharePoint, Intune…)
# Kräver Entra-app med Application-behörighet ServiceHealth.Read.All + admin consent.
# Sätt env: MS_TENANT_ID, MS_CLIENT_ID, MS_CLIENT_SECRET
[source.m365tenant]
category = "Microsoft"
page = "https://admin.microsoft.com/#/servicehealth"
name = "Microsoft 365 (tenant)"
type = "msgraph"
enabled = false
include_advisories = true

