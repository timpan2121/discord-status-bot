name: Driftstatus till Discord

on:
  schedule:
    - cron: "*/5 * * * *"     # var 5:e minut (GitHub kan fördröja några minuter)
  workflow_dispatch: {}        # kör manuellt från Actions-fliken

concurrency:
  group: statusbot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # för cache + keepalive nedan

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests

      # Senaste state (vilka incidenter som redan postats) + översättningscache
      - name: Hämta state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            translations.json
          key: statusbot-${{ github.run_id }}
          restore-keys: statusbot-

      # Allra första körningen: lär in nuläget utan att posta (inga gamla incidenter)
      - name: Baslinje (första körningen)
        if: steps.state.outputs.cache-matched-key == ''
        run: python statusbot.py --once --dry-run --state state.json > /dev/null

      - name: Kontrollera tjänster och posta
        if: steps.state.outputs.cache-matched-key != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python statusbot.py --once --state state.json

      # GitHub pausar schemalagda körningar efter 60 dagar utan aktivitet i repot.
      # Att "aktivera" arbetsflödet via API:t nollställer den räknaren.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/status.yml/enable" || true

      - name: Spara state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            translations.json
          key: statusbot-${{ github.run_id }}
